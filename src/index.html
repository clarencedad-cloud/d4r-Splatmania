<!DOCTYPE html>
<html>
    <head>
        <title>Splatmania</title>
        <meta charset="utf-8" />
        <base href="__BASE_HREF__">
        <link rel="manifest" href="./manifest.json">
        <meta name="theme-color" content="#15121e">
        <link rel="stylesheet" href="./index.css?v=__BUILD__">
        <link rel="icon" href="./static/icons/logo-192.png?v=__BUILD__" type="image/png">
        <link rel="apple-touch-icon" href="./static/icons/logo-192.png?v=__BUILD__">
        <meta name="description" content="Splatmania – free Gaussian splat editor by design4real: clean up, align, animate and render your splats to video and 360° panoramas." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

        <!-- offline cache for the installed app (sw.js, network first). Workers
             from other builds in this app's folder are removed, as are their
             caches. Only this folder: the app may share its origin with a
             website (e.g. design4real.de/apps/splatmania/) whose own service
             workers must stay untouched. -->
        <script>
            navigator.serviceWorker?.getRegistrations().then(regs => regs.forEach((reg) => {
                if (!reg.scope.startsWith(document.baseURI)) return;
                const url = reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL || '';
                if (!url.endsWith('/sw.js')) reg.unregister();
            }));
            window.caches?.keys().then(keys => keys.forEach((key) => {
                if (key.startsWith('superSplat-v')) caches.delete(key);
            }));
            if (window.isSecureContext && navigator.serviceWorker) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('service worker', err));
                });
            }
        </script>
    </head>

    <body>
        <script type="module" src="./index.js?v=__BUILD__"></script>
    </body>
</html>
